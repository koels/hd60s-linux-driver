PACKAGE_NAME="hd60s"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="hd60s"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# CachyOS kernels are built with clang, so modules must be too
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 modules"
AUTOINSTALL="yes"
